<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4096" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">ReSellReady — an open Gemma AI agent for side-hustle sellers</title>
  <desc id="desc">A warm editorial cover with a black listing panel, neon yellow accents, and marketplace listing language.</desc>
  <rect width="1600" height="1600" fill="#f4f0e7"/>
  <g transform="translate(0 380)">
  <circle cx="1410" cy="112" r="76" fill="#e7ff57"/>
  <text x="1410" y="102" text-anchor="middle" fill="#1a1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">YOUR</text>
  <text x="1410" y="126" text-anchor="middle" fill="#1a1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">NEXT SALE</text>

  <text x="112" y="126" fill="#72706a" font-family="monospace" font-size="18" letter-spacing="5">OPEN-SOURCE AI / SIDE HUSTLE</text>
  <text x="105" y="270" fill="#1a1917" font-family="Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-7">ReSellReady</text>
  <text x="112" y="355" fill="#ff6c43" font-family="Georgia, serif" font-size="66" font-style="italic">turn notes into sales.</text>
  <text x="112" y="435" fill="#5c5a55" font-family="Arial, sans-serif" font-size="27">A product-adaptive AI listing agent for</text>
  <text x="112" y="475" fill="#5c5a55" font-family="Arial, sans-serif" font-size="27">vintage sellers, makers, bakers, and creators.</text>

  <rect x="112" y="570" width="510" height="86" fill="#1a1917"/>
  <text x="145" y="606" fill="#e7ff57" font-family="monospace" font-size="17" letter-spacing="3">POWERED BY OPEN GEMMA</text>
  <text x="145" y="636" fill="#f4f0e7" font-family="monospace" font-size="16">HOSTED · ADAPTABLE · EDITABLE</text>

  <g transform="translate(875 198) rotate(3)">
    <rect width="560" height="480" fill="#ff6c43"/>
    <rect x="-15" y="-15" width="560" height="480" fill="#1a1917" stroke="#1a1917" stroke-width="2"/>
    <line x1="0" y1="70" x2="530" y2="70" stroke="#45433e" stroke-width="2"/>
    <text x="34" y="43" fill="#99958c" font-family="monospace" font-size="15" letter-spacing="3">LIVE LISTING AGENT</text>
    <text x="34" y="125" fill="#e7ff57" font-family="monospace" font-size="14" letter-spacing="2">OPEN MODEL / GEMMA</text>
    <text x="34" y="205" fill="#f4f0e7" font-family="Arial, sans-serif" font-size="46" font-weight="700">One product.</text>
    <text x="34" y="258" fill="#ff6c43" font-family="Georgia, serif" font-size="45" font-style="italic">Many ways to sell.</text>
    <rect x="34" y="316" width="395" height="8" fill="#3a3935"/>
    <rect x="34" y="338" width="315" height="8" fill="#3a3935"/>
    <rect x="34" y="360" width="225" height="8" fill="#3a3935"/>
    <text x="34" y="425" fill="#99958c" font-family="monospace" font-size="14" letter-spacing="2">TITLE · DESCRIPTION · TAGS</text>
    <text x="34" y="450" fill="#e7ff57" font-family="monospace" font-size="14" letter-spacing="2">BUYER CHECKLIST ↗</text>
  </g>
  </g>
</svg>
