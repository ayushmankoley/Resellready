<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4096" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">ReSellReady — an open Gemma AI agent for side-hustle sellers</title>
  <desc id="desc">A warm editorial cover with a black listing panel, neon yellow accents, and marketplace listing language.</desc>
  <rect width="1600" height="1600" fill="#f4f0e7"/>
  <circle cx="1375" cy="190" r="118" fill="#e7ff57"/>
  <text x="1375" y="176" text-anchor="middle" fill="#1a1917" font-family="Arial, sans-serif" font-size="25" font-weight="700">YOUR</text>
  <text x="1375" y="210" text-anchor="middle" fill="#1a1917" font-family="Arial, sans-serif" font-size="25" font-weight="700">NEXT SALE</text>

  <text x="108" y="170" fill="#72706a" font-family="monospace" font-size="22" letter-spacing="6">OPEN-SOURCE AI / SIDE HUSTLE</text>
  <text x="96" y="365" fill="#1a1917" font-family="Arial, sans-serif" font-size="154" font-weight="800" letter-spacing="-10">ReSellReady</text>
  <text x="108" y="485" fill="#ff6c43" font-family="Georgia, serif" font-size="88" font-style="italic">turn notes into sales.</text>
  <text x="108" y="585" fill="#5c5a55" font-family="Arial, sans-serif" font-size="32">A product-adaptive AI listing agent for</text>
  <text x="108" y="632" fill="#5c5a55" font-family="Arial, sans-serif" font-size="32">vintage sellers, makers, bakers, and creators.</text>

  <rect x="108" y="760" width="690" height="118" fill="#1a1917"/>
  <text x="148" y="809" fill="#e7ff57" font-family="monospace" font-size="21" letter-spacing="3">POWERED BY OPEN GEMMA</text>
  <text x="148" y="850" fill="#f4f0e7" font-family="monospace" font-size="19">HOSTED · ADAPTABLE · EDITABLE</text>

  <g transform="translate(140 1050) rotate(-2)">
    <rect width="1320" height="390" fill="#b5d7dc"/>
    <text x="55" y="75" fill="#1a1917" font-family="monospace" font-size="21" letter-spacing="4">SELLER WORKFLOW</text>
    <g fill="#1a1917">
      <rect x="55" y="130" width="270" height="150"/>
      <rect x="370" y="130" width="270" height="150"/>
      <rect x="685" y="130" width="270" height="150"/>
      <rect x="1000" y="130" width="265" height="150"/>
    </g>
    <g fill="#e7ff57" font-family="monospace" font-size="22">
      <text x="82" y="178">01</text><text x="397" y="178">02</text><text x="712" y="178">03</text><text x="1027" y="178">04</text>
    </g>
    <g fill="#f4f0e7" font-family="Arial, sans-serif" font-size="25" font-weight="700">
      <text x="82" y="230">ADD FACTS</text><text x="397" y="230">PICK WORLD</text><text x="712" y="230">GEMMA WRITES</text><text x="1027" y="230">PUBLISH</text>
    </g>
  </g>

  <g transform="translate(815 690) rotate(3)">
    <rect width="625" height="690" fill="#ff6c43"/>
    <rect x="-20" y="-20" width="625" height="690" fill="#1a1917" stroke="#1a1917" stroke-width="2"/>
    <line x1="0" y1="92" x2="585" y2="92" stroke="#45433e" stroke-width="2"/>
    <text x="42" y="56" fill="#99958c" font-family="monospace" font-size="19" letter-spacing="4">LIVE LISTING AGENT</text>
    <text x="42" y="160" fill="#e7ff57" font-family="monospace" font-size="18" letter-spacing="3">OPEN MODEL / GEMMA</text>
    <text x="42" y="265" fill="#f4f0e7" font-family="Arial, sans-serif" font-size="58" font-weight="700">One product.</text>
    <text x="42" y="330" fill="#ff6c43" font-family="Georgia, serif" font-size="54" font-style="italic">Many ways to sell.</text>
    <rect x="42" y="405" width="450" height="10" fill="#3a3935"/>
    <rect x="42" y="435" width="360" height="10" fill="#3a3935"/>
    <rect x="42" y="465" width="270" height="10" fill="#3a3935"/>
    <text x="42" y="555" fill="#99958c" font-family="monospace" font-size="18" letter-spacing="3">TITLE · DESCRIPTION · TAGS</text>
    <text x="42" y="600" fill="#e7ff57" font-family="monospace" font-size="18" letter-spacing="3">BUYER CHECKLIST ↗</text>
  </g>
</svg>
